name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 8.4Task5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 8.4Task5/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile collection script
        run: python -m py_compile scripts/collect_stock_data.py

      - name: Run unit tests
        run: python -m pytest -q
